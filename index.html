<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Holo Card AR Prototype</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      #hint { position: fixed; z-index: 10; left: 1rem; right: 1rem; bottom: 1.5rem; margin: auto;
        max-width: 28rem; padding: .8rem 1rem; border-radius: .8rem; color: white;
        background: rgba(0, 0, 0, .7); text-align: center; pointer-events: none; }
      #credit { position: fixed; z-index: 10; top: max(1rem, env(safe-area-inset-top)); right: 1rem;
        padding: .35rem .55rem; border-radius: .4rem; background: rgba(0, 0, 0, .7);
        color: white; font-size: .7rem; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="hint" role="status">Allow camera access, then point at the Holo card.</div>
    <a id="credit" href="https://sketchfab.com/3d-models/hainanese-chicken-rice-6a0d0aa3851849508f584248f96cd417" target="_blank" rel="noopener noreferrer">3D model: National Heritage Board (CC BY 4.0)</a>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>
      <a-assets>
        <a-asset-item id="character" src="./assets/hainanese_chicken_rice.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="food-model"
          src="#character"
          position="0 0 0.05"
          rotation="90 0 0"
          scale="0.2 0.2 0.2"
          animation="property: position; from: 0 0 0.05; to: 0 0 0.08; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const hint = document.querySelector('#hint');
      const target = document.querySelector('#card-target');
      const model = document.querySelector('#food-model');
      let modelReady = false;
      let targetVisible = false;

      const updateHint = () => {
        hint.textContent = targetVisible
          ? (modelReady ? 'Move the card to see the model follow it.' : 'Card found. Loading the 3D model...')
          : 'Point your camera at the Holo card.';
      };

      model.addEventListener('model-loaded', () => { modelReady = true; updateHint(); });
      model.addEventListener('model-error', (event) => {
        hint.textContent = 'The 3D model failed to load. Check the browser console.';
        console.error('3D model failed to load:', event.detail);
      });
      target.addEventListener('targetFound', () => { targetVisible = true; updateHint(); });
      target.addEventListener('targetLost', () => { targetVisible = false; updateHint(); });
    </script>
  </body>
</html>
