<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chiah Pah Bway? | Holo Card AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden;
        font-family: system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
      a-scene { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
      [hidden] { display: none !important; }
      #hint, #story { position: fixed; z-index: 10;
        left: max(.75rem, env(safe-area-inset-left));
        right: max(.75rem, env(safe-area-inset-right));
        bottom: max(.75rem, env(safe-area-inset-bottom));
        max-width: 28rem; margin-inline: auto; padding: .85rem 1rem;
        border: 1px solid rgba(255, 211, 111, .5); border-radius: .9rem;
        color: white; background: rgba(31, 15, 39, .9); text-align: center;
        box-shadow: 0 .4rem 1.5rem rgba(0, 0, 0, .28); }
      #hint { pointer-events: none; line-height: 1.4; }
      #story { max-height: min(50dvh, 19rem); overflow-y: auto; overscroll-behavior: contain; }
      #story h1 { margin: 0 0 .3rem; font-size: clamp(1.1rem, 5vw, 1.3rem); line-height: 1.2; }
      #story p { margin: 0 0 .75rem; font-size: clamp(.88rem, 3.6vw, .96rem); line-height: 1.4; }
      #actions { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; }
      #actions button { border: 0; border-radius: 999px; padding: .7rem 1rem; min-height: 44px;
        background: #ffd36f; color: #321323; font: inherit; font-size: 1rem; font-weight: 700;
        cursor: pointer; touch-action: manipulation; }
      #actions button:disabled { opacity: .7; cursor: wait; }
      #actions button:focus-visible, #credit:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      #credit { position: fixed; z-index: 10;
        top: max(.75rem, env(safe-area-inset-top)); right: max(.75rem, env(safe-area-inset-right));
        max-width: min(16rem, 55vw); padding: .4rem .55rem; border-radius: .4rem;
        background: rgba(0, 0, 0, .72); color: white; font-size: .72rem;
        line-height: 1.25; text-align: right; text-decoration: underline; overflow-wrap: anywhere; }
      @media (max-width: 380px) {
        #story { padding: .75rem; }
        #actions { flex-direction: column; }
        #actions button { width: 100%; }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #hint, #story { left: auto; right: max(.6rem, env(safe-area-inset-right));
          bottom: max(.6rem, env(safe-area-inset-bottom)); width: min(19rem, 44vw);
          max-height: calc(100dvh - 3rem); padding: .65rem .75rem; }
        #story h1 { font-size: 1.05rem; }
        #story p { font-size: .82rem; margin-bottom: .5rem; }
        #actions button { min-height: 44px; padding: .55rem .75rem; }
      }
    </style>
  </head>
  <body>
    <div id="hint" role="status">Allow camera access, then point at the Holo card.</div>
    <section id="story" aria-live="polite" hidden>
      <h1 id="story-title">Chiah pah bway?</h1>
      <p id="story-text">“Have you eaten yet?” Tap to see the meal behind this greeting.</p>
      <div id="actions">
        <button id="reveal-button" type="button">Reveal the meal</button>
        <button id="audio-button" type="button" hidden>Hear the phrase</button>
      </div>
    </section>
    <audio id="phrase-audio" src="./assets/sound.mp3" preload="none"></audio>
    <a id="credit" href="https://sketchfab.com/3d-models/hainanese-chicken-rice-6a0d0aa3851849508f584248f96cd417" target="_blank" rel="noopener noreferrer">3D model: National Heritage Board (CC BY 4.0)</a>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>
      <a-assets>
        <img id="ghost-image" src="./assets/ghost-cutout.png" alt="" />
        <a-asset-item id="character" src="./assets/hainanese_chicken_rice.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <a-plane id="ghost" src="#ghost-image" material="transparent: true; side: double; shader: flat"
          width="1" height="1.04" position="0 0.28 0.2" scale="0.01 0.01 0.01"
          animation__pop="property: scale; from: 0.01 0.01 0.01; to: 1.6 1.6 1.6; dur: 700; easing: easeOutElastic; startEvents: pop"
          animation__make_room="property: position; from: 0 0.28 0.2; to: -0.23 0.42 0.2; dur: 450; easing: easeOutCubic; startEvents: make-room"
          animation__shrink="property: scale; from: 1.6 1.6 1.6; to: 0.84 0.84 0.84; dur: 450; easing: easeOutCubic; startEvents: make-room"></a-plane>

        <a-entity id="meal" visible="false">
          <a-ring position="0 -0.22 0.055" radius-inner="0.58" radius-outer="0.64"
            material="color: #ffd36f; opacity: 0.55; transparent: true; side: double"
            animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: 12000; loop: true; easing: linear"></a-ring>
          <a-gltf-model id="food-model" src="#character" position="0 -0.22 0.08" rotation="90 0 0"
            scale="0.01 0.01 0.01"
            animation__reveal="property: scale; from: 0.01 0.01 0.01; to: 0.4 0.4 0.4; dur: 650; easing: easeOutElastic; startEvents: reveal"
            animation__float="property: position; from: 0 -0.22 0.08; to: 0 -0.22 0.11; dur: 1400; easing: easeInOutSine; loop: true; dir: alternate; startEvents: reveal"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const hint = document.querySelector('#hint');
      const story = document.querySelector('#story');
      const storyTitle = document.querySelector('#story-title');
      const storyText = document.querySelector('#story-text');
      const revealButton = document.querySelector('#reveal-button');
      const audioButton = document.querySelector('#audio-button');
      const phraseAudio = document.querySelector('#phrase-audio');
      const target = document.querySelector('#card-target');
      const ghost = document.querySelector('#ghost');
      const meal = document.querySelector('#meal');
      const model = document.querySelector('#food-model');
      let modelReady = false;
      let targetVisible = false;
      let revealed = false;

      // Set to true after adding assets/chiah-pah-bway.mp3, recorded by a fluent speaker.
      const phraseAudioReady = true;
      audioButton.hidden = !phraseAudioReady;

      const updateUI = () => {
        hint.hidden = targetVisible;
        story.hidden = !targetVisible;
        if (!targetVisible) {
          hint.textContent = 'Point your camera at the Holo card.';
          return;
        }
        storyTitle.textContent = revealed ? 'A greeting that shows care' : 'Chiah pah bway?';
        storyText.textContent = revealed
          ? '“Have you eaten yet?” can also mean “Are you okay?” The meal is a symbol of care.'
          : '“Have you eaten yet?” Tap to see the meal behind this greeting.';
        revealButton.hidden = revealed;
        revealButton.disabled = !modelReady;
        if (!modelReady && !revealed) revealButton.textContent = 'Loading the meal…';
        if (modelReady) revealButton.textContent = 'Reveal the meal';
      };

      model.addEventListener('model-loaded', () => { modelReady = true; updateUI(); });
      model.addEventListener('model-error', (event) => {
        storyText.textContent = 'The 3D meal failed to load. Check the browser console.';
        console.error('3D model failed to load:', event.detail);
      });
      target.addEventListener('targetFound', () => {
        targetVisible = true;
        revealed = false;
        meal.setAttribute('visible', false);
        model.setAttribute('scale', '0.01 0.01 0.01');
        ghost.setAttribute('position', '0 0.28 0.2');
        ghost.setAttribute('scale', '0.01 0.01 0.01');
        ghost.emit('pop');
        updateUI();
      });
      target.addEventListener('targetLost', () => {
        targetVisible = false;
        phraseAudio.pause();
        updateUI();
      });
      revealButton.addEventListener('click', () => {
        if (!targetVisible || !modelReady || revealed) return;
        revealed = true;
        meal.setAttribute('visible', true);
        ghost.emit('make-room');
        model.emit('reveal');
        updateUI();
      });
      audioButton.addEventListener('click', async () => {
        try { phraseAudio.currentTime = 0; await phraseAudio.play(); }
        catch (error) { console.error('Phrase audio could not play:', error); }
      });
    </script>
  </body>
</html>
